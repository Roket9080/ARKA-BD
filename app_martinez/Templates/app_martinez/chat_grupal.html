{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Grupal - ARKA</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header grupal">
            <h2>Chat Grupal (RF-NU-0009)</h2>
            <p>Conectado como: <strong>{{ user.username }}</strong></p>
        </div>
        <div class="chat-box">
            {% for m in mensajes %}
                <div class="mensaje grupal">
                    <strong>{{ m.emisor.username }}</strong>
                    <p>{{ m.contenido }}</p>
                    <small>{{ m.fecha_envio|date:"H:i" }}</small>
                </div>
            {% empty %}
                <p class="empty-chat">No hay mensajes guardados en el chat grupal.</p>
            {% endfor %}
        </div>
        <form class="chat-form grupal" method="POST">
            {% csrf_token %}
            <input type="text" name="mensaje" placeholder="Escribe un mensaje en el chat..." required autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
