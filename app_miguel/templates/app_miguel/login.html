{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARKA - Iniciar Sesión</title>
  
  <!-- Carga del CSS desde archivos estáticos de Django -->
  <link rel="stylesheet" href="{% static 'app_miguel/css/login.css' %}">
</head>
<body>

  <!-- Luces ambientales de fondo -->
  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <div class="login-container">
    <div class="logo-container">
      <div class="logo-icon-angel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <!-- Halo -->
          <ellipse cx="12" cy="3.5" rx="4" ry="1.2" />
          <!-- Cabeza -->
          <circle cx="12" cy="7" r="2" />
          <!-- Alas -->
          <path d="M10 11C7 10 3 11 2 15C4.5 15.5 7.5 14 9.5 12" />
          <path d="M14 11C17 10 21 11 22 15C19.5 15.5 16.5 14 14.5 12" />
          <!-- Túnica -->
          <path d="M10 12L8 21H16L14 12" />
        </svg>
      </div>
      <span class="logo-text">ARKA</span>
    </div>

    <div class="login-header">
      <h2>¡Bienvenido de nuevo!</h2>
      <p>Ingresa a tu cuenta de ARKA</p>
    </div>

    {% if error %}
      <div class="alert-error">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" id="loginForm">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="username">Usuario o Correo</label>
        <input type="text" name="username" id="username" placeholder="Ingresa tu usuario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" style="accent-color: var(--primary-purple);"> Recordarme
        </label>
      </div>

      <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>

    <div class="divider">
      <span>o continúa con</span>
    </div>

    <button type="button" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
        <path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.4C.6 9.3 0 11.6 0 14s.6 4.7 1.6 6.6l3.7-2.8z"/>
        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 20.4 7.4 23 12 23z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>

    <div class="auth-footer">
      <p>¿No tienes una cuenta? <a href="{% url 'registrarse' %}">Regístrate aquí</a></p>
      <a href="/" class="back-link">← Volver al inicio</a>
    </div>
  </div>

  <!-- Carga del JS desde archivos estáticos -->
  <script src="{% static 'app_miguel/js/login.js' %}"></script>
</body>
</html>
