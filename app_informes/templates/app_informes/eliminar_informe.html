{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Informe</title>
    <link rel="stylesheet" href="{% static 'estilos.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/1653/1653611.png" alt="Logo ARKA">
        <h2>ARKA</h2>
    </div>
    <div class="nav-links">
        <a href="{% url 'lista_informes' %}">📊 Informes</a>
        <a href="{% url 'crear_informe' %}">➕ Crear</a>
        <a href="/admin/">⚙️ Admin</a>
    </div>
</nav>

<div class="contenedor-alerta">
    <h1>⚠️ ¿Estás seguro?</h1>
    <p>Vas a eliminar el informe con ID: <strong>{{ informe.id_informe }}</strong> ({{ informe.usuario }}). Esta acción no se puede deshacer.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn-eliminar">🗑️ Sí, eliminar</button>
        <a href="{% url 'lista_informes' %}" class="btn-cancelar">❌ Cancelar</a>
    </form>
</div>

</body>
</html>
