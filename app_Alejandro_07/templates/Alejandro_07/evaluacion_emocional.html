<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluación emocional - ARKA</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app_Alejandro_07/arka.css' %}">
</head>

<body>

<div class="contenedor contenedor-evaluacion-form">

    <h1>Evaluación emocional</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Usuario</label>
        <input type="text" name="usuario" required>

        <label>Profesional</label>
        <input type="text" name="profesional" required>

        <label>Estado afectivo</label>
        <input type="text" name="estado_afectivo" required>

        <label>Nivel de riesgo</label>

        <select name="nivel_riesgo" required>
            <option value="">Seleccione</option>
            <option value="Bajo">Bajo</option>
            <option value="Medio">Medio</option>
            <option value="Alto">Alto</option>
        </select>

        <label>Necesidades detectadas</label>
        <textarea name="necesidades_detectadas" required></textarea>

        <label>Observaciones</label>
        <textarea name="observaciones"></textarea>

        <label>Recomendaciones</label>
        <textarea name="recomendaciones"></textarea>

        <button type="submit">
            Guardar evaluación
        </button>

    </form>

</div>

</body>

</html>
