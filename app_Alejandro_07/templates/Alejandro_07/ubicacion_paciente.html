<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ubicación del paciente - ARKA</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'app_Alejandro_07/arka.css' %}?v=3">
</head>

<body>

<div class="contenedor contenedor-ubicacion-form">

    <img class="logo-arka" src="{% static 'app_Alejandro_07/arka-logo.png' %}" alt="Logo de ARKA">
    <h1>Ubicación del paciente</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Paciente</label>
        <input type="text" name="paciente" required>

        <label>Latitud</label>
        <input type="number" step="any" name="latitud" required>

        <label>Longitud</label>
        <input type="number" step="any" name="longitud" required>

        <label>Motivo</label>
        <input type="text" name="motivo">

        <label>
            <input
                class="autorizacion"
                type="checkbox"
                name="autorizacion"
                required
            >

            Autorizo compartir mi ubicación
        </label>

        <button type="submit">
            Guardar ubicación
        </button>

    </form>

</div>

</body>

</html>
