<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Profesional</title>
</head>
<body>
    <h1>¿Estás seguro?</h1>
    <p>Vas a eliminar al profesional: <strong>{{ profesional.nombres }} {{ profesional.apellidos }}</strong></p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_profesional' %}">Cancelar</a>
    </form>
</body>
</html>
