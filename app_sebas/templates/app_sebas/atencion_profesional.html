{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atención Profesional</title>
    <link rel="stylesheet" href="{% static 'app_sebas/estilos.css' %}">
</head>
<body>
    <nav class="navbar">
        <a class="logo" href="{% url 'lista_profesional' %}">
            <img src="{% static 'recursos/imagenes/fotos/ARKA.jpeg' %}" alt="Logo ARKA">
        </a>
        <div class="nav-links">
            <a href="{% url 'lista_profesional' %}">👨‍⚕️ Profesionales</a>
            <a href="{% url 'registro_profesional' %}">➕ Registrar</a>
            <a href="{% url 'lista_chats' %}">💬 Chats</a>
            <a href="{% url 'admin:index' %}">⚙️ Admin</a>
        </div>
    </nav>
    <main class="contenedor-form">
        <h1>Atención de un Profesional en Salud</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="campo">
                <label for="profesional_id">Profesional:</label>
                <select id="profesional_id" name="profesional_id" required>
                    {% for profesional in profesionales %}
                        <option value="{{ profesional.id_profesional }}">{{ profesional.nombres }} {{ profesional.apellidos }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="campo">
                <label for="motivo">Motivo de Atención:</label>
                <textarea id="motivo" name="motivo" required></textarea>
            </div>
            <div class="campo">
                <label for="diagnostico">Diagnóstico:</label>
                <textarea id="diagnostico" name="diagnostico"></textarea>
            </div>
            <div class="campo">
                <label for="plan_intervencion">Plan de Intervención:</label>
                <textarea id="plan_intervencion" name="plan_intervencion"></textarea>
            </div>
            <div class="acciones-form">
                <button type="submit" class="btn-guardar">Registrar Atención</button>
                <a href="{% url 'lista_profesional' %}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
