{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atención Profesional</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #f0f4f8, #ffffff); padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        form { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #2980b9; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.8; }
        .btn-cancelar { background-color: #7f8c8d; padding: 10px 20px; text-decoration: none; color: white; border-radius: 4px; display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Atención de un Profesional en Salud</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Profesional:</label>
        <select name="profesional_id" required>
            {% for profesional in profesionales %}
                <option value="{{ profesional.id_profesional }}">{{ profesional.nombres }} {{ profesional.apellidos }}</option>
            {% endfor %}
        </select>
        <label>Motivo de Atención:</label>
        <textarea name="motivo" required></textarea>
        <label>Diagnóstico:</label>
        <textarea name="diagnostico"></textarea>
        <label>Plan de Intervención:</label>
        <textarea name="plan_intervencion"></textarea>
        
        <button type="submit">Registrar Atención</button>
        <a href="{% url 'lista_profesional' %}" class="btn-cancelar">Cancelar</a>
    </form>
</body>
</html>
