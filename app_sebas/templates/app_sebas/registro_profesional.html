{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Profesional</title>
    <link rel="stylesheet" href="{% static 'estilos.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/1653/1653611.png" alt="Logo ARKA">
        <h2>ARKA</h2>
    </div>
    <div class="nav-links">
        <a href="{% url 'lista_profesional' %}">👨‍⚕️ Profesionales</a>
        <a href="{% url 'registro_profesional' %}">➕ Registrar</a>
        <a href="/admin/">⚙️ Admin</a>
    </div>
</nav>

<div class="contenedor-form">
    <h1>➕ Registro de Profesionales en Salud</h1>
    <form method="POST">
        {% csrf_token %}
        
        <div class="campo">
            <label>Identificador (Único):</label>
            <input type="text" name="identificador" required>
        </div>

        <div class="campo">
            <label>Contraseña:</label>
            <input type="password" name="contrasena" required>
        </div>

        <div class="campo">
            <label>Nombres Completos:</label>
            <input type="text" name="nombres" required>
        </div>

        <div class="campo">
            <label>Apellidos Completos:</label>
            <input type="text" name="apellidos" required>
        </div>

        <div class="campo">
            <label>Correo Electrónico:</label>
            <input type="email" name="correo" required>
        </div>

        <div class="campo">
            <label>Número de Teléfono:</label>
            <input type="text" name="telefono" required>
        </div>

        <div class="campo">
            <label>Contacto de Emergencia:</label>
            <input type="text" name="contacto_emergencia" required>
        </div>

        <div class="campo">
            <label>Disponibilidad y Horarios:</label>
            <input type="text" name="disponibilidad_horarios" required>
        </div>

        <div class="campo">
            <label>Dirección:</label>
            <input type="text" name="direccion" required>
        </div>

        <div class="acciones-form">
            <button type="submit" class="btn-guardar">💾 Registar</button>
            <a href="{% url 'lista_profesional' %}" class="btn-cancelar">❌ Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
