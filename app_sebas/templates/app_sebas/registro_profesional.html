{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Profesional</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #f0f4f8, #ffffff); padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        form { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.8; }
        .btn-cancelar { background-color: #7f8c8d; padding: 10px 20px; text-decoration: none; color: white; border-radius: 4px; display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>Registro de Profesionales en Salud</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Identificador (Único):</label>
        <input type="text" name="identificador" required>
        <label>Contraseña:</label>
        <input type="password" name="contrasena" required>
        <label>Nombres Completos:</label>
        <input type="text" name="nombres" required>
        <label>Apellidos Completos:</label>
        <input type="text" name="apellidos" required>
        <label>Correo Electrónico:</label>
        <input type="email" name="correo" required>
        <label>Número de Teléfono:</label>
        <input type="text" name="telefono" required>
        <label>Contacto de Emergencia:</label>
        <input type="text" name="contacto_emergencia" required>
        <label>Disponibilidad y Horarios:</label>
        <input type="text" name="disponibilidad_horarios" required>
        <label>Dirección:</label>
        <input type="text" name="direccion" required>
        
        <button type="submit">Registrar</button>
        <a href="{% url 'lista_profesional' %}" class="btn-cancelar">Cancelar</a>
    </form>
</body>
</html>
