{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Chat - ARKA</title>
    <link rel="stylesheet" href="{% static 'app_sebas/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'app_chat/estilos.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <img src="{% static 'recursos/imagenes/fotos/ARKA.jpeg' %}" alt="Logo ARKA">
    </div>
    <div class="nav-links">
        <a href="{% url 'lista_profesional' %}">👨‍⚕️ Profesionales</a>
        <a href="{% url 'lista_chats' %}" aria-current="page">💬 Chats</a>
        <a href="{% url 'admin:index' %}">⚙️ Admin</a>
    </div>
</nav>

<div class="contenedor-form">
    <header class="cabecera">
        <h1>➕ Crear Nuevo Chat</h1>
    </header>

    <!-- Formulario de Django -->
    <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="campo">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="mensaje-error">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}

        <div class="acciones-form">
            <a href="{% url 'lista_chats' %}" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-guardar">Guardar Chat</button>
        </div>
    </form>
</div>

</body>
</html>
